<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>US Market Reader</title>
<style>
:root{--bg:#f6f7f9;--pn:#fff;--tx:#1b2430;--mu:#667085;--ln:#e2e5ea;--ac:#0b6b4f;--hl:#fff3c4}
@media(prefers-color-scheme:dark){:root{--bg:#0f1418;--pn:#171e25;--tx:#e6eaee;--mu:#93a0ad;--ln:#27313a;--ac:#4cc79b;--hl:#4a4116}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--ln);background:var(--pn);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{margin:0;font:700 18px Georgia,serif}header small{color:var(--mu)}
main{display:grid;grid-template-columns:320px 1fr 280px;gap:16px;max-width:1280px;margin:0 auto;padding:16px}
.col{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px;min-height:200px}
.col h2{font-size:14px;color:var(--mu);margin:8px 8px 4px}
.it{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:10px 8px;border-bottom:1px solid var(--ln);cursor:pointer}
.it:hover,.it.on{background:var(--hl)}.it b{display:block;font-size:15px;line-height:1.35}
.meta{font-size:12px;color:var(--mu)}.tier{color:var(--ac);font-weight:600}
article{padding:12px 16px}article h2{font:700 24px/1.3 Georgia,serif;margin:4px 0 10px;color:var(--tx)}
.body{font-size:18px;line-height:1.9}.w{cursor:pointer;border-radius:3px}.w:hover{background:var(--hl);outline:1px solid var(--ac)}
.btn{display:inline-block;margin:6px 8px 0 0;padding:8px 12px;border:1px solid var(--ac);border-radius:6px;color:var(--ac);background:none;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.ko{margin-top:10px;padding:10px;background:var(--bg);border-radius:6px;font-size:15px}
#back{display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--pn);border:1px solid var(--ln);border-radius:12px 12px 0 0;padding:14px 16px 20px;box-shadow:0 -4px 20px #0003;display:none;max-height:55vh;overflow:auto}
#sheet h3{margin:0}#sheet .x{float:right;border:0;background:none;color:var(--tx);font-size:22px}
#sheet .kr{font-size:20px;color:var(--ac);font-weight:700;margin:4px 0}
@media(max-width:900px){main{grid-template-columns:1fr;padding:8px}#detail,#rel{display:none}
body.read #list{display:none}body.read #detail,body.read #rel{display:block}#back{display:inline-block}}
</style></head><body>
<header><h1>US Market Reader</h1><small id="upd"></small></header>
<main>
 <section class="col" id="list"><h2>오늘의 뉴스</h2><div id="items">불러오는 중…</div></section>
 <section class="col" id="detail"><article id="art"><p class="meta">왼쪽에서 기사를 고르세요. 영어 단어를 누르면 뜻이 나옵니다.</p></article></section>
 <aside class="col" id="rel"><h2>관련 뉴스</h2><div id="relitems"></div></aside>
</main>
<div id="sheet"><button class="x" onclick="sheet.style.display='none'">×</button><div id="sc"></div></div>
<script>
const $=id=>document.getElementById(id);let DATA=[];const cache={};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wrap=s=>esc(s).replace(/[A-Za-z][A-Za-z'’-]*/g,w=>`<span class="w">${w}</span>`);
const fmt=d=>new Date(d).toLocaleString("ko-KR",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
const card=a=>`<button class="it" data-i="${a.id}"><b>${esc(a.title)}</b><span class="meta"><span class="tier">${a.tier}</span> ${a.source} · ${fmt(a.date)}</span></button>`;
fetch("news.json").then(r=>r.json()).then(j=>{DATA=j.items;$("upd").textContent="업데이트 "+fmt(j.updated);
 $("items").innerHTML=DATA.map(card).join("")||"뉴스가 없습니다. Actions를 실행하세요."}).catch(()=>$("items").textContent="news.json을 불러오지 못했습니다.");
document.addEventListener("click",e=>{
 const it=e.target.closest(".it");if(it)return open(+it.dataset.i);
 const w=e.target.closest(".w");if(w)return lookup(w.textContent);
});
function open(i){const a=DATA[i];document.body.classList.add("read");scrollTo(0,0);
 document.querySelectorAll("#items .it").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
 $("art").innerHTML=`<button class="btn" id="back" onclick="document.body.classList.remove('read')">← 목록</button>
 <p class="meta"><span class="tier">${a.tier}</span> ${a.source} · ${fmt(a.date)}</p><h2>${wrap(a.title)}</h2>
 <div class="body">${wrap(a.summary||"(요약 없음 — 원문에서 확인하세요)")}</div>
 <a class="btn" href="${esc(a.link)}" target="_blank" rel="noopener">원문 보기</a><button class="btn" id="tr">한국어로 번역</button><div id="ko"></div>`;
 $("tr").onclick=async()=>{$("ko").innerHTML='<div class="ko">번역 중…</div>';const t=await trans((a.title+". "+a.summary).slice(0,480));$("ko").innerHTML=`<div class="ko">${esc(t||"번역 실패")}</div>`};
 $("relitems").innerHTML=a.related.map(j=>card(DATA[j])).join("")||'<p class="meta" style="padding:8px">관련 기사가 없습니다.</p>';}
async function trans(q){try{const r=await fetch("https://api.mymemory.translated.net/get?langpair=en|ko&q="+encodeURIComponent(q));return(await r.json()).responseData.translatedText}catch{return""}}
async function define(w){const base=w.toLowerCase().replace(/['’]s$/,"");
 const c=[base,base.replace(/ies$/,"y"),base.replace(/(es|s)$/,""),base.replace(/(ed|d)$/,""),base.replace(/ing$/,""),base.replace(/ing$/,"e")];
 for(const x of[...new Set(c)]){try{const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+x);if(r.ok)return{word:x,d:(await r.json())[0]}}catch{}}return null}
async function lookup(w){const k=w.toLowerCase();$("sheet").style.display="block";
 if(cache[k]){$("sc").innerHTML=cache[k];return}
 $("sc").innerHTML=`<h3>${esc(w)}</h3><p class="meta">찾는 중…</p>`;
 const [def,ko]=await Promise.all([define(w),trans(w)]);
 let h=`<h3>${esc(w)} <button class="btn" onclick="speechSynthesis.speak(new SpeechSynthesisUtterance('${esc(w)}'))">🔊</button></h3>`;
 if(ko&&ko.toLowerCase()!==k)h+=`<div class="kr">${esc(ko)}</div>`;
 if(def){const d=def.d;h+=`<p class="meta">${esc(d.phonetic||"")}${def.word!==k?" (원형: "+def.word+")":""}</p>`;
  d.meanings.slice(0,3).forEach(m=>{const f=m.definitions[0];h+=`<p><i>${m.partOfSpeech}</i> — ${esc(f.definition)}${f.example?`<br><span class="meta">e.g. ${esc(f.example)}</span>`:""}</p>`})}
 else h+='<p class="meta">영어 사전에서 찾지 못했습니다.</p>';
 cache[k]=h;$("sc").innerHTML=h}
</script></body></html>
